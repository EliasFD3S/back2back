[build]
  command = "npm run build"
  publish = "dist"

# Assets Vite (hashés) : cache longue durée
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Modèles 3D, textures et polices : cache d'une semaine
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
